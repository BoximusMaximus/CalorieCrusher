name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test_backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: calorie_crusher_test
          POSTGRES_USER: calorie_crusher
          POSTGRES_PASSWORD: calorie_crusher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calorie_crusher -d calorie_crusher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_SERVER_HOSTNAME: localhost
      POSTGRES_DB: calorie_crusher_test
      POSTGRES_USER: calorie_crusher
      POSTGRES_PASSWORD: calorie_crusher
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend/calorie_crusher_proj

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/calorie_crusher_proj/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python manage.py test tests
